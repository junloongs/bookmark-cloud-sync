name: 功能建议（Feature Request）
description: 提出新功能或改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        在提建议之前，请先搜索现有 issue 避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题是什么？
      description: 用一两句话描述你的痛点（不是「想要 X 功能」而是「我遇到 Y 问题，希望这样解决」）
      validations:
        required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 描述你希望的扩展行为
      validations:
        required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 是否有其他方式能达到相同效果？
      validations:
        required: false

  - type: dropdown
    id: priority
    attributes:
      label: 对你的重要性
      options:
        - 阻塞我使用 - 没有这个功能我没法用
        - 重要 - 我每天都会用
        - 一般 - 偶尔会用到
        - 小改进 - 锦上添花
      validations:
        required: true

  - type: textarea
    id: context
    additional: true
    attributes:
      label: 补充信息（使用场景、相关扩展截图等）
      validations:
        required: false