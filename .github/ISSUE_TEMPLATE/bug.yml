name: Bug 报告（Bug Report）
description: 报告本扩展的 bug（同步失败、错误提示、界面问题等）
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告 bug！请提供尽可能详细的信息，以帮助我们快速定位问题。

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器与版本
      options:
        - Chrome (Chrome 桌面版)
        - Edge (Edge 桌面版)
        - Firefox (Firefox 桌面版)
        - 360 极速 X
        - 夸克浏览器
        - QQ 浏览器
        - 其他 Chromium 内核
      validations:
        required: true

  - type: input
    id: version
    attributes:
      label: 浏览器版本号
      placeholder: 例如 Chrome 118 / Edge 118 / Firefox 119
      validations:
        required: true

  - type: dropdown
    id: webdav
    attributes:
      label: 使用的 WebDAV 服务
      options:
        - 坚果云 Nutstore (https://dav.jianguoyun.com/dav/)
        - Nextcloud
        - ownCloud
        - Synology
        - 自建 WebDAV
        - 其他
      validations:
        required: true

  - type: input
    id: webdav-url
    attributes:
      label: WebDAV 服务器地址（可脱敏，例如 https://dav.example.com/dav/）
      validations:
        required: false

  - type: dropdown
    id: sync-mode
    attributes:
      label: 触发场景
      options:
        - 测试连接失败
        - 保存设置失败
        - 合并同步失败
        - 上传覆盖失败
        - 下载覆盖失败
        - 自动同步不工作
        - 界面显示异常
        - 其他
      validations:
        required: true

  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      placeholder: |
        1. 打开扩展设置页
        2. 填入...
        3. 点击...
        4. 看到...
      validations:
        required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      validations:
        required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为（含错误提示原文）
      validations:
        required: true

  - type: dropdown
    id: permission
    attributes:
      label: host permission 状态
      description: 在 chrome://extensions → 详细信息 → 网站访问处检查
      options:
        - 已授权
        - 未授权
        - 不确定
      validations:
        required: true

  - type: textarea
    id: diag
    attributes:
      label: 诊断面板输出（设置页底部 → 刷新权限状态 → 把输出粘到这里）
      validations:
        required: false

  - type: textarea
    id: notes
    additional: true
    attributes:
      label: 补充说明（截图、相关环境等）
      validations:
        required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 安全检查
      options:
        - label: 我确认**没有**在 issue 里粘贴真实的 WebDAV 账号密码
          required: true
        - label: 我已经搜索过 [现有 issue](https://github.com/junloongs/bookmark-cloud-sync/issues) 没有重复
          required: true