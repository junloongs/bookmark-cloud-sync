<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title">📚 书签云同步</div>
    <span id="statusDot" class="dot" title="同步状态"></span>
  </header>

  <section id="configMissing" class="card warn hidden">
    尚未配置 WebDAV，<a href="#" id="openOptions1">去设置</a>
  </section>

  <section class="card">
    <div class="row">
      <span class="label">服务器</span>
      <span id="serverInfo" class="value">—</span>
    </div>
    <div class="row">
      <span class="label">上次同步</span>
      <span id="lastSync" class="value">尚未同步</span>
    </div>
    <div id="lastDetail" class="row detail"></div>
  </section>

  <div class="actions">
    <button id="btnMerge" class="primary">⇅ 合并同步</button>
    <button id="btnUpload">↑ 上传覆盖</button>
    <button id="btnDownload">↓ 下载覆盖</button>
  </div>

  <div id="msg" class="msg hidden"></div>

  <footer>
    <a href="#" id="openOptions">⚙ 设置</a>
  </footer>

  <script src="shim.js"></script>
  <script src="popup.js"></script>
</body>
</html>
